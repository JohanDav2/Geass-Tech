<style>
  :root { --nav-red:#711525; --nav-deep:#33070e; --nav-accent:#e8a93b; --sidebar-red:#75162a; --sidebar-red-dark:#560c1a; --sidebar-red-active:rgba(255, 255, 255, 0.22); --nav-ink:#151c26; --nav-muted:#5b6675; --nav-surface:#fff; --nav-soft:#faf8f4; --nav-border:rgb(21 28 38 / 8%); --sidebar-width:64px; --topbar-height:64px; }
  .app-sidebar { position:fixed; z-index:30; top:0; bottom:0; left:0; display:flex; width:var(--sidebar-width); flex-direction:column; align-items:center; padding:0; color:#fff; background:var(--sidebar-red); box-shadow:2px 0 12px rgb(64 8 21 / 18%); }
  .app-logo { display:grid; width:100%; height:42px; margin:0; place-items:center; border-radius:0; background:transparent; box-shadow:none; }

  .app-nav, .app-nav-footer { display:flex; width:100%; flex-direction:column; align-items:center; gap:6px; }
  .app-nav { flex:1; gap:0; padding-top:18px; }
  .app-nav-footer { gap:0; padding:0; border:0; }
  .nav-link { position:relative; display:grid; width:100%; height:52px; place-items:center; border-radius:0; color:rgb(255 255 255 / 82%); transition:background .18s, color .18s; }
  .nav-link:hover, .nav-link:focus-visible { color:#fff; background:rgba(255, 255, 255, 0.12); outline:none; }
  .nav-link.is-active { color:#fff; background:rgba(255, 255, 255, 0.24); box-shadow:inset 3px 0 0 #fff; }
  .nav-link.is-active::before { display:none; }
  .nav-link svg { width:21px; fill:none; stroke:currentColor; stroke-width:1.9; }
  .nav-link span { position:absolute; left:calc(100% + 10px); padding:6px 10px; border-radius:5px; color:#fff; background:var(--sidebar-red-dark); font-size:12px; opacity:0; pointer-events:none; transform:translateX(-5px); transition:.15s; white-space:nowrap; }
  .nav-link:hover span, .nav-link:focus-visible span { opacity:1; transform:none; }
  .app-topbar { position:fixed; z-index:20; top:0; right:0; left:var(--sidebar-width); display:flex; height:var(--topbar-height); align-items:center; justify-content:space-between; gap:18px; padding:0 24px; border-bottom:1px solid var(--nav-border); background:var(--nav-surface); }
  .app-brand { display:flex; height:40px; align-items:center; padding:7px 12px; border-radius:8px; background:#000000; }
  .app-brand img { display:block; width:106px; height:24px; object-fit:contain; }
  .app-actions { display:flex; align-items:center; gap:10px; }
  .app-search { display:flex; width:280px; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--nav-border); border-radius:10px; background:var(--nav-soft); }
  .app-search input { width:100%; border:0; outline:0; background:transparent; color:var(--nav-ink); font:inherit; font-size:13px; }
  .app-icon { position:relative; display:grid; width:38px; height:38px; place-items:center; border:0; border-radius:10px; color:var(--nav-muted); background:transparent; cursor:pointer; }
  .app-icon:hover, .app-icon:focus-visible { color:var(--nav-red); background:var(--nav-soft); outline:none; }
  .app-icon svg { width:19px; fill:none; stroke:currentColor; stroke-width:1.8; }
  .notification-count { position:absolute; top:4px; right:4px; display:grid; min-width:15px; height:15px; place-items:center; border-radius:8px; color:#fff; background:#dd7a3b; font-size:9px; }
  .profile { position:relative; }
  .profile-button { display:flex; align-items:center; gap:9px; padding:5px 8px 5px 5px; border:0; border-radius:10px; background:transparent; cursor:pointer; }
  .profile-button:hover { background:var(--nav-soft); }
  .avatar { display:grid; width:32px; height:32px; place-items:center; border-radius:50%; color:#f3c978; background:linear-gradient(135deg, var(--nav-red), #93202f); font-size:12px; font-weight:700; }
  .profile-meta { display:flex; flex-direction:column; text-align:left; line-height:1.2; }
  .profile-meta strong { font-size:13px; } .profile-meta small { color:var(--nav-muted); font-size:11px; }
  .profile-menu { position:absolute; top:calc(100% + 10px); right:0; display:none; width:220px; padding:6px; border:1px solid var(--nav-border); border-radius:14px; background:#fff; box-shadow:0 8px 24px rgb(21 28 38 / 12%); }
  .profile[data-open="true"] .profile-menu { display:block; }
  .profile-menu a { display:block; padding:9px 10px; border-radius:8px; color:var(--nav-ink); font-size:13px; text-decoration:none; }
  .profile-menu a:hover { background:var(--nav-soft); } .profile-menu .logout { color:var(--nav-red); }
  @media (max-width:720px) { .app-topbar { padding:0 12px; } .app-search { display:none; } .profile-meta { display:none; } }
</style>
