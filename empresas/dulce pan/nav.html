<style>
  :root {
    --nav-red: #711525;
    --nav-deep: #33070e;
    --nav-accent: #e8a93b;
    --sidebar-red: #75162a;
    --sidebar-red-dark: #560c1a;
    --sidebar-red-active: rgba(255, 255, 255, 0.2);
    --nav-ink: #151c26;
    --nav-muted: #5b6675;
    --nav-surface: #fff;
    --nav-soft: #faf8f4;
    --nav-border: rgb(21 28 38 / 8%);
    --sidebar-width: 62px;
    --topbar-height: 64px;
  }

  .app-sidebar {
    position: fixed;
    z-index: 30;
    top: 0;
    bottom: 0;
    left: 0;
    display: flex;
    width: var(--sidebar-width);
    flex-direction: column;
    align-items: center;
    padding: 0;
    color: #fff;
    background: var(--sidebar-red);
    box-shadow: 2px 0 12px rgb(64 8 21 / 18%);
  }

  .app-logo {
    display: grid;
    width: 100%;
    height: 48px;
    margin: 0;
    place-items: center;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

  .app-logo svg {
    width: 20px;
    height: 20px;
    stroke-width: 1.5;
  }

  .app-nav,
  .app-nav-footer {
    display: flex;
    width: 100%;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .app-nav {
    flex: 1;
    gap: 4px;
    padding-top: 8px;
    overflow-y: auto;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
  }

  .app-nav::-webkit-scrollbar {
    width: 3px;
  }

  .app-nav::-webkit-scrollbar-track {
    background: transparent;
  }

  .app-nav::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
  }

  .app-nav-footer {
    gap: 0;
    padding: 0;
    border: 0;
  }

  .nav-link {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 56px;
    padding: 4px 2px;
    gap: 3px;
    color: rgba(255, 255, 255, 0.82);
    text-decoration: none;
    transition: background .18s, color .18s;
  }

  .nav-link:hover,
  .nav-link:focus-visible {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    outline: none;
  }

  .nav-link.is-active {
    color: #fff;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: inset 3px 0 0 #fff;
  }

  .nav-link.is-active::before {
    display: none;
  }

  .nav-link svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
  }

  .nav-link span {
    position: static;
    display: block;
    color: #ffffff;
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 0.03em;
    text-align: center;
    white-space: nowrap;
    opacity: 0.9;
    transform: none;
    background: transparent;
    padding: 0;
  }

  .nav-link.is-active span {
    font-weight: 500;
    opacity: 1;
    color: #ffffff;
  }

  .app-topbar {
    position: fixed;
    z-index: 20;
    top: 0;
    right: 0;
    left: var(--sidebar-width);
    display: flex;
    height: var(--topbar-height);
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 0 24px;
    border-bottom: 1px solid var(--nav-border);
    background: var(--nav-surface);
  }

  .app-brand {
    display: flex;
    height: 40px;
    align-items: center;
    padding: 7px 12px;
    border-radius: 8px;
    background: #000000;
  }

  .app-brand img {
    display: block;
    width: 106px;
    height: 24px;
    object-fit: contain;
  }

  .app-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .app-search {
    display: flex;
    width: 280px;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--nav-border);
    border-radius: 10px;
    background: var(--nav-soft);
  }

  .app-search input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--nav-ink);
    font: inherit;
    font-size: 13px;
  }

  .app-icon {
    position: relative;
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    border: 0;
    border-radius: 10px;
    color: var(--nav-muted);
    background: transparent;
    cursor: pointer;
  }

  .app-icon:hover,
  .app-icon:focus-visible {
    color: var(--nav-red);
    background: var(--nav-soft);
    outline: none;
  }

  .app-icon svg {
    width: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
  }

  .notification-count {
    position: absolute;
    top: 4px;
    right: 4px;
    display: grid;
    min-width: 15px;
    height: 15px;
    place-items: center;
    border-radius: 8px;
    color: #fff;
    background: #dd7a3b;
    font-size: 9px;
  }

  .profile {
    position: relative;
  }

  .profile-button {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 5px 8px 5px 5px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
  }

  .profile-button:hover {
    background: var(--nav-soft);
  }

  .avatar {
    display: grid;
    width: 36px;
    height: 36px;
    place-items: center;
    border-radius: 50%;
    color: #fff;
    background: linear-gradient(135deg, var(--nav-red), #93202f);
    font-size: 13px;
    font-weight: 700;
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid rgba(21, 28, 38, 0.12);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }

  .profile-meta {
    display: flex;
    flex-direction: column;
    text-align: left;
    line-height: 1.2;
  }

  .profile-meta strong {
    font-size: 13px;
  }

  .profile-meta small {
    color: var(--nav-muted);
    font-size: 11px;
  }

  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    display: none;
    width: 220px;
    padding: 6px;
    border: 1px solid var(--nav-border);
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 8px 24px rgb(21 28 38 / 12%);
  }

  .profile[data-open="true"] .profile-menu {
    display: block;
  }

  .profile-menu a {
    display: block;
    padding: 9px 10px;
    border-radius: 8px;
    color: var(--nav-ink);
    font-size: 13px;
    text-decoration: none;
  }

  .profile-menu a:hover {
    background: var(--nav-soft);
  }

  .profile-menu .logout {
    color: var(--nav-red);
  }

  .notifications-wrapper {
    position: relative;
  }

  .notifications-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    display: none;
    width: 320px;
    max-height: 420px;
    background: #ffffff;
    border: 1px solid var(--nav-border);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(21, 28, 38, 0.15);
    z-index: 50;
    flex-direction: column;
    overflow: hidden;
  }

  .notifications-wrapper[data-open="true"] .notifications-menu {
    display: flex;
  }

  .notifications-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--nav-border);
    background: var(--nav-soft);
  }

  .notifications-header strong {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--nav-ink);
  }

  .notifications-badge-count {
    background: var(--nav-red);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .notifications-list {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    max-height: 350px;
    padding: 6px;
    gap: 4px;
  }

  .notifications-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    color: var(--nav-muted);
    text-align: center;
  }

  .notifications-empty svg {
    opacity: 0.35;
    margin-bottom: 8px;
  }

  .notifications-empty p {
    margin: 0;
    font-size: 13px;
    font-weight: 500;
  }

  .notification-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 12px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--nav-ink);
    background: transparent;
    transition: background .15s ease;
    cursor: pointer;
  }

  .notification-item:hover {
    background: var(--nav-soft);
  }

  .notification-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .notification-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--nav-ink);
    margin: 0;
    line-height: 1.3;
  }

  .notification-time {
    font-size: 11px;
    color: var(--nav-muted);
    white-space: nowrap;
  }

  .notification-msg {
    font-size: 12px;
    color: var(--nav-muted);
    margin: 0;
    line-height: 1.4;
  }

  .notification-priority-alta,
  .notification-priority-urgente {
    border-left: 3px solid #dc2626;
    padding-left: 9px;
  }

  .notification-priority-normal {
    border-left: 3px solid #3b82f6;
    padding-left: 9px;
  }

  .nav-toggle-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--nav-ink);
    cursor: pointer;
    transition: background .15s;
  }

  .nav-toggle-btn:hover {
    background: var(--nav-soft);
  }

  @media (max-width:800px) {
    :root {
      --sidebar-width: 0px;
    }

    .nav-toggle-btn {
      display: flex;
    }

    .app-sidebar {
      top: var(--topbar-height);
      left: 0;
      right: 0;
      bottom: auto;
      width: 100%;
      max-height: calc(100vh - var(--topbar-height));
      background-color: var(--sidebar-red);
      z-index: 25;
      flex-direction: column;
      padding: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      transform: translateY(-120%);
      opacity: 0;
      pointer-events: none;
      transition: transform .25s ease, opacity .25s ease;
    }

    .app-sidebar.is-mobile-open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .app-logo {
      display: none;
    }

    .app-nav {
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      gap: 6px;
      padding: 4px 0;
    }

    .nav-link {
      flex-direction: row;
      justify-content: flex-start;
      width: 100%;
      height: 46px;
      padding: 0 16px;
      gap: 12px;
      border-radius: 10px;
    }

    .nav-link svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .nav-link span {
      font-size: 13.5px;
      font-weight: 500;
      opacity: 1;
      text-align: left;
    }

    .nav-link.is-active {
      box-shadow: none;
      background: rgba(255, 255, 255, 0.25);
    }

    .app-topbar {
      left: 0;
      padding: 0 16px;
    }

    .app-search {
      display: none;
    }

    .profile-meta {
      display: none;
    }

    .settings-page,
    .portal-content,
    main {
      margin-left: 0 !important;
    }
  }
</style>
