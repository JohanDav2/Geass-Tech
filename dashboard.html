<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/icons/favicon3.png">
  <title>Dashboard | Geass Tech</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; color:#151c26; background:#faf8f4; font-family:Inter, ui-sans-serif, system-ui, sans-serif; }
    .dashboard-content { min-height:100vh; margin-left:64px; padding:calc(64px + 42px) 42px 42px; }
    .dashboard-card { max-width:720px; padding:32px; border:1px solid rgb(21 28 38 / 8%); border-radius:18px; background:#fff; box-shadow:0 8px 24px rgb(21 28 38 / 6%); }
    .dashboard-card h1 { margin:0 0 10px; color:#711525; font-size:clamp(1.8rem, 3vw, 2.5rem); }
    .dashboard-card p { max-width:560px; margin:0; color:#5b6675; line-height:1.6; }
    @media (max-width:720px) { .dashboard-content { padding:calc(64px + 24px) 20px 28px; } .dashboard-card { padding:24px; } }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <main class="dashboard-content" id="inicio">
    <section class="dashboard-card">
      <h1>Bienvenido a tu panel</h1>
      <p>Gestiona la información de tu organización desde el menú lateral.</p>
    </section>
  </main>

  <script type="module">
    import { initializeNavbar, loadComponent } from "./templates/js/components.js";

    loadComponent("navbar", "./templates/nav.html")
      .then(initializeNavbar)
      .catch((error) => console.error("No se pudo cargar la navegación:", error));
  </script>
</body>
</html>
