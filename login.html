<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Geass Tech</title>
  <style>
    :root {
      --navy: #182d67;
      --blue: #1c4a91;
      --ink: #14234e;
      --muted: #70809c;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1d3679;
      background-image: radial-gradient(circle at 14% 8%, #38549a 0, transparent 29%), linear-gradient(135deg, #203d85, #17295d);
    }

    .login-card {
      width: min(100%, 1000px);
      min-height: 570px;
      display: grid;
      grid-template-columns: minmax(300px, 40%) 1fr;
      overflow: hidden;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 60px rgb(4 15 50 / 35%);
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      padding: 44px 48px 32px;
    }

    .brand { display: inline-flex; align-items: center; gap: 9px; font-size: .88rem; font-weight: 800; letter-spacing: -.03em; }
    .brand-mark { width: 28px; height: 28px; border-radius: 8px 8px 8px 2px; background: var(--navy); box-shadow: 8px 0 0 #4e70a8; }
    .brand span { display: block; line-height: 1.05; }

    .login-content { width: 100%; max-width: 290px; margin: auto; text-align: center; }
    .avatar { width: 68px; height: 68px; margin: 0 auto 26px; display: grid; place-items: center; border-radius: 50%; background: var(--navy); color: #fff; box-shadow: 0 6px 14px rgb(20 35 78 / 20%); }
    .avatar svg { width: 37px; }
    h1 { margin: 0 0 8px; font-size: 1.55rem; letter-spacing: -.05em; }
    .intro { margin: 0 0 26px; color: var(--muted); font-size: .87rem; }

    form { text-align: left; }
    label { display: block; margin: 0 0 7px 3px; font-size: .7rem; font-weight: 800; letter-spacing: .08em; color: #576783; }
    .field { position: relative; margin-bottom: 16px; }
    .field svg { position: absolute; top: 50%; left: 14px; width: 17px; color: #7785a0; transform: translateY(-50%); }
    input { width: 100%; height: 46px; padding: 0 14px 0 43px; border: 1px solid #d8dfeb; border-radius: 8px; outline: none; color: var(--ink); font: inherit; transition: border-color .2s, box-shadow .2s; }
    input:focus { border-color: #365ca8; box-shadow: 0 0 0 3px rgb(54 92 168 / 13%); }
    .form-row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 22px; font-size: .73rem; }
    .remember { display: inline-flex; align-items: center; gap: 6px; color: #66738b; }
    .remember input { width: 13px; height: 13px; padding: 0; accent-color: var(--navy); }
    a { color: #294e99; font-weight: 700; text-decoration: none; }
    .login-button { width: 100%; height: 46px; border: 0; border-radius: 8px; cursor: pointer; color: #fff; background: var(--navy); font: inherit; font-weight: 800; letter-spacing: .07em; transition: background .2s, transform .2s; }
    .login-button:hover { background: #25478f; transform: translateY(-1px); }
    .register { margin: 21px 0 0; color: var(--muted); font-size: .76rem; text-align: center; }
    .dots { margin-top: 28px; color: #213b7a; font-size: 1.25rem; line-height: 1; letter-spacing: 4px; text-align: center; }

    .welcome-panel { position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; padding: 42px 48px; color: #fff; background: #1d3c83; isolation: isolate; }
    .welcome-panel::before, .welcome-panel::after { position: absolute; z-index: -1; content: ""; border-radius: 48% 52% 44% 56% / 58% 42% 58% 42%; filter: blur(2px); }
    .welcome-panel::before { width: 520px; height: 630px; top: -135px; right: -58px; background: radial-gradient(ellipse at 37% 32%, #fff1c6 0 8%, #b8d9e0 25%, #498fb9 45%, #24508e 64%, transparent 66%); transform: rotate(-23deg); }
    .welcome-panel::after { width: 440px; height: 600px; right: 55px; bottom: -390px; background: linear-gradient(142deg, transparent 18%, #e5ebc2 37%, #75afbd 54%, #194382 77%); transform: rotate(25deg); }
    .top-nav { display: flex; justify-content: flex-end; align-items: center; gap: 26px; font-size: .72rem; }
    .top-nav a { color: rgb(255 255 255 / 75%); font-weight: 600; }
    .top-nav .nav-login { padding: 8px 17px; border-radius: 18px; color: #fff; background: #172b63; }
    .welcome-copy { margin: auto 0; padding: 70px 0 33px; }
    .welcome-copy p { margin: 0 0 8px; font-size: .77rem; letter-spacing: .13em; text-transform: uppercase; opacity: .8; }
    .welcome-copy h2 { margin: 0; max-width: 330px; font-size: clamp(2.4rem, 5vw, 4.45rem); line-height: .95; letter-spacing: -.07em; }
    .welcome-footer { color: rgb(255 255 255 / 72%); font-size: .72rem; text-align: right; }

    @media (max-width: 720px) {
      body { padding: 16px; }
      .login-card { grid-template-columns: 1fr; max-width: 460px; }
      .welcome-panel { min-height: 250px; order: -1; padding: 28px; }
      .welcome-copy { padding: 35px 0 12px; }
      .welcome-copy h2 { font-size: 3rem; }
      .form-panel { min-height: 550px; padding: 32px 30px 26px; }
      .top-nav { display: none; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <section class="form-panel" aria-labelledby="login-title">
      <div class="brand" aria-label="Geass Tech"><i class="brand-mark"></i><span>Geass<br>Tech</span></div>
      <div class="login-content">
        <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c.8-4 3.35-6 7.5-6s6.7 2 7.5 6"/></svg></div>
        <h1 id="login-title">Inicia sesión</h1>
        <p class="intro">Ingresa tus datos para continuar.</p>
        <form>
          <label for="username">USUARIO</label>
          <div class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c.8-4 3.2-6 7-6s6.2 2 7 6"/></svg><input id="username" name="username" type="text" placeholder="Tu usuario" autocomplete="username" required></div>
          <label for="password">CONTRASEÑA</label>
          <div class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required></div>
          <div class="form-row"><label class="remember"><input type="checkbox"> Recordarme</label><a href="#">¿Olvidaste tu contraseña?</a></div>
          <button class="login-button" type="submit">INGRESAR</button>
        </form>
        <p class="register">¿Aún no tienes cuenta? <a href="#">Regístrate</a></p>
        <div class="dots" aria-hidden="true">•••</div>
      </div>
    </section>
    <section class="welcome-panel" aria-label="Bienvenida">
      <nav class="top-nav"><a href="#">Inicio</a><a href="#">Nosotros</a><a href="#">Contacto</a><a class="nav-login" href="#">Ingresar</a></nav>
      <div class="welcome-copy"><p>Plataforma digital</p><h2>Bienvenido.</h2></div>
      <div class="welcome-footer">Todo lo que necesitas, en un solo lugar.</div>
    </section>
  </main>
</body>
</html>
